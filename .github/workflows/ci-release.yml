name: ci-release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  test-build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Print tool versions
        run: |
          set -euo pipefail
          bash --version
          git --version
          python3 --version
          dpkg --version
          dpkg-deb --version

      - name: Validate template
        run: bash scripts/validate-template.sh

      - name: Run original tests
        run: ./test-original.sh

      - name: Run safe tests
        run: ./test-safe.sh

      - name: Build .deb
        env:
          SAFELIBS_COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          rm -rf build dist
          bash scripts/build-deb.sh

      - name: Locate built artifact
        id: artifact
        run: |
          set -euo pipefail
          mapfile -t debs < <(find dist -type f -name '*.deb' -print | sort)
          if (( ${#debs[@]} != 1 )); then
            printf 'Expected exactly one .deb under dist/, found %d.\n' "${#debs[@]}" >&2
            find dist -type f -print >&2 || true
            exit 1
          fi
          printf 'deb=%s\n' "${debs[0]}" >> "$GITHUB_OUTPUT"

      - name: Upload Debian artifact
        uses: actions/upload-artifact@v4
        with:
          name: debs-${{ github.run_id }}
          path: ${{ steps.artifact.outputs.deb }}
          if-no-files-found: error

      - name: Publish commit release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          DEB_FILE: ${{ steps.artifact.outputs.deb }}
        run: |
          set -euo pipefail

          tag="commit-${GITHUB_SHA}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --tags --force origin

          if ! git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            git tag -f "$tag" "$GITHUB_SHA"
            git push origin "refs/tags/$tag"
          fi

          notes_file="$(mktemp)"
          {
            printf 'Commit SHA: %s\n\n' "$GITHUB_SHA"
            printf 'Attached .deb file was produced by `scripts/build-deb.sh`.\n'
          } > "$notes_file"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$DEB_FILE" --clobber
          else
            gh release create "$tag" "$DEB_FILE" --title "Safe library deb for ${GITHUB_SHA:0:12}" --notes-file "$notes_file"
          fi

          rm -f "$notes_file"
